name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build frontend
        run: |
          cd frontend/
          bun install --frozen-lockfile
          bun run build
          cd ..

      - name: Build default theme
        run: bash scripts/fetch-default-theme.sh --force

      - name: Build backend
        run: go build -v ./backend/cmd/vexgo

      - name: Test backend
        run: go test -v -race -count=1 ./...
