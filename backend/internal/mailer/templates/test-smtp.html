<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background-color: #4caf50;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .content {
        padding: 20px;
        background-color: #f9f9f9;
      }
      .success {
        color: #4caf50;
        font-weight: bold;
      }
      .info {
        background-color: #e3f2fd;
        padding: 15px;
        border-radius: 4px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>SMTP Configuration Test</h1>
      </div>
      <div class="content">
        <p>Dear {{ .Name }},</p>
        <p class="success">✓ Test email sent successfully!</p>
        <p>
          Your SMTP configuration is working correctly. You can now use email
          verification features.
        </p>

        <div class="info">
          <strong>Configuration details:</strong><br />
          SMTP Server: {{ .Host }}:{{ .Port }}<br />
          Sender: {{ .Name }} <{{ .Email }}>
        </div>

        <p>Time: {{ .Time }}</p>
      </div>
    </div>
  </body>
</html>
